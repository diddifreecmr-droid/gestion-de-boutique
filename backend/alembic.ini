# Alembic — migrations de l'adaptateur SQL (specs § 5.6). Depuis backend/ :
#   uv run alembic upgrade head          # base de DATABASE_URL (environnement ou .env)
#   uv run alembic revision -m "…"       # nouvelle migration (une par changement, jamais éditée
#                                        # après fusion)
# L'URL n'est jamais écrite ici : alembic/env.py la lit dans la configuration validée.

[alembic]
script_location = %(here)s/alembic
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
