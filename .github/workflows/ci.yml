name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, mypy, import-linter, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run python tools/check_file_length.py
      - run: uv run pytest --cov

  backend-postgres:
    # Preuve de substituabilité (specs § 12.1, A8) : la même suite de contrats sur PostgreSQL.
    name: Backend PostgreSQL (migrations, contrats, concurrence)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: boutique
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: boutique_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boutique -d boutique_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONUTF8: "1"
      DATABASE_URL: postgresql+psycopg://boutique:ci-only-password@127.0.0.1:5432/boutique_test
      TEST_DATABASE_URL: postgresql+psycopg://boutique:ci-only-password@127.0.0.1:5432/boutique_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest tests/contracts tests/infrastructure/postgres --backend=postgres -ra

  frontend:
    name: Frontend (lint, types, tests, build, poids)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run check:length
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run check:no-showcase
      - run: npm run size

  e2e:
    # Playwright Chromium 360 × 800 + 1280 px, axe-core (recette § 5, specs § 12.1). Backend
    # jetable (mémoire, port 8100) et frontend Vite (5273) démarrés par playwright.config.ts.
    name: E2E (Playwright, Chromium)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsc --noEmit
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
